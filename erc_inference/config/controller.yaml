# Motion controller for the model nodes: turns localization and the model's
# selected waypoint into /omnivla/cmd_vel. checkpoint_controller_node then applies
# acceleration limits (max_linear_accel & co., its own parameters) on the way to
# /cmd_vel.
#
# scripts/omni_vla_wrapper (edge) and scripts/omni_vla_original_wrapper (original)
# both load this file, so the two models run the same control law. Defaults live
# in erc_inference/motion_control.py (DEFAULT_PARAMS); every value can also be
# changed while the rover drives, e.g.
#   ros2 param set /omnivla_edge_node polar.steering_source model
#   ros2 param set /omnivla_edge_node polar.min_linear_vel 0.2
#
# Every change here should be re-run through test/controller_sim.py, which
# loads this file.
#
# Write every float with a decimal point: ROS 2 rejects `60` for a parameter
# declared as 60.0 ("wrong parameter type").

# Node-scoped, NOT under /**: each node has its own checkpoint, and the wildcard
# would point omnivla_original_node at the edge .pth. It also has to stay out of
# the /** block because test_motion_control and controller_sim assert that block
# only sets parameters motion_control.DEFAULT_PARAMS declares.
/omnivla_edge_node:
  ros__parameters:
    # Absolute path: the node's default ("./omnivla-edge/omnivla-edge.pth")
    # is relative to whatever directory the process is launched from, which
    # ros2 launch does not guarantee is this repo.
    model_checkpoint_path: /home/nvidia-ott/lsdc/erc-omni-vla/OmniVLA/omnivla-edge/omnivla-edge.pth

/**:
  ros__parameters:
    # "polar" -- bearing-tracking controller (see polar.* below).
    # "pid"   -- heading PID on the bearing to the model's waypoint only.
    controller_type: polar

    # Hard limits, applied by both controllers. Together they set the tightest
    # turn the rover can be commanded to make: radius = linear / angular.
    max_linear_vel: 0.3
    max_angular_vel: 0.3

    # When the goal is behind the rover, stop and turn in place toward it before
    # handing control back. Driven by localization, not by the model.
    goal_turn:
      enabled: true
      enter_deg: 90.0       # engage past this bearing to the goal
      exit_deg: 45.0        # release under this; the ~1.3 s between a command
                            # and its effect in the heading carries the turn
                            # most of the rest of the way, and polar
                            # steering finishes it
      angular_vel: 0.3      # in place this ran at 1.18x of command on
                            # mission_16sept; lower speeds are untested
      linear_vel: 0.0       # 0 = in place
      min_distance_m: 1.0   # ignore bearing jitter this close to the goal
      # Full stop before the spin starts. mission_16sept went from 0.22 m/s
      # forward to a 0.3 rad/s spin in one tick. That spin turned the rover to
      # face a raised planter missing from OSM; it drove over the curb and
      # rolled (docs/Mission16sept.md section 2). GoalTurn turns toward the carrot
      # whatever is there.
      brake_s: 1.0

    polar:
      # What the rover steers toward.
      #   "plan"   -- the model is the local planner: the point plan_lookahead_m
      #               along its predicted path, kept within
      #               max_plan_deviation_deg of the carrot's bearing. The carrot
      #               (A* route) bounds where the plan may take the rover.
      #   "carrot" -- the carrot alone, located by GPS + heading; the model is
      #               only logged. Same as "plan" with a 0 deg cone.
      #   "model"  -- the bearing of the model's selected waypoint, unbounded
      #               (mission_16sept's steering).
      # On mission_16sept the model's bearing was 0.117x the bearing to the
      # carrot (683 ticks, r = 0.60): median 5 deg asked against 36 deg needed on
      # leg 3. Steering on it kept the rover pointed 20-35 deg away from the
      # carrot (median per leg); cross-track to the route stayed 0.6-1.4 m, but
      # when the carrot swung behind, only GoalTurn corrected it.
      steering_source: plan
      # How far along the model's path the plan is aimed (the carrot's own
      # lookahead), and the shortest path trusted as a plan: the model predicted
      # paths under 0.3 m on 22% of mission_16sept's ticks, and those leave the
      # carrot alone in charge.
      plan_lookahead_m: 1.5
      plan_min_length_m: 0.3
      #
      # What the plan adds to the carrot: its bearing MINUS the share of the
      # carrot's bearing the model turns by on its own, less a deadzone, capped.
      #   deviation = clip(shift(plan - plan_bearing_gain x carrot, deadzone), +-cone)
      # The model's plan turned 0.117x the carrot's bearing (mission_16sept, 683
      # ticks, r = 0.60, 5 deg noise). Capping the raw plan-carrot difference
      # instead (gain 1.0) let that underturning through: on those ticks it moved
      # the bearing 20 deg at the median, always toward straight ahead. The
      # residual left after removing 0.117x was 3 deg median, 7.9 deg p90, and
      # crossed the 8 deg deadzone on 9% of ticks.
      #
      # test/controller_sim.py, both timing readings, 1440 missions per row,
      # all complete, stalls p95 <= 0.8 s. "Sidestep": the emulated model veers
      # 25 deg for 10 s every 25 s; median distance the rover moved that way.
      #                                  no obstacles           with sidesteps
      #                                  xtrack p50/p95/max  weave  sidestep  weave
      #   carrot only                    0.19/1.98/2.7 m   2.6/min  0.09 m  2.6/min
      #   raw cone 20 (gain 1.0)         0.26/2.27/3.3 m   1.7/min  0.51 m  2.8/min
      #   residual, deadzone 0, cone 20  0.20/1.99/2.8 m   3.9/min  0.50 m  5.4/min
      #   residual, deadzone 8, cone 30  0.19/1.99/2.7 m   2.6/min  0.46 m  4.6/min  <- chosen
      # If the real gain is not 0.117 (swept 0.0-1.0), cross-track stays at
      # p50 0.19-0.22 m; weave rises to 6.0/min at 1.0, where the model would be
      # turning fully by itself and the residual double-counts the carrot.
      # The deadzone is what keeps the model's 5 deg noise from weaving the
      # rover. At 1.5 m ahead a 30 deg deviation is 0.87 m sideways.
      plan_bearing_gain: 0.117
      plan_deviation_deadzone_deg: 8.0
      max_plan_deviation_deg: 30.0

      # How forward speed is chosen.
      #   "cruise" -- max_linear_vel while the bearing is within
      #               slowdown_start_deg, tapering to min_linear_vel at
      #               slowdown_end_deg. Never a speed in (0, min_linear_vel).
      #   "rho"    -- k_rho x distance to the model's waypoint (Siegwart). On
      #               mission_16sept this fell to 0.05 m/s whenever the model
      #               predicted a short waypoint (16% of ticks, runs up to 19 s),
      #               and the rover stood still: held commands of 0.049-0.065
      #               m/s never moved it, held 0.3 m/s always did.
      linear_law: cruise
      # Must stay above the speed at which the rover starts to move, which is
      # somewhere between 0.065 and 0.26 m/s and not measured yet: run the
      # 0.05 -> 0.30 m/s ramp in the field before lowering this.
      min_linear_vel: 0.25
      slowdown_start_deg: 30.0
      slowdown_end_deg: 60.0

      # Steering on the carrot. Chosen with test/controller_sim.py over 5
      # scenarios x 36 rover models (delay 0.9-1.8 s, moving yaw gain 0.2-1.0,
      # breakaway 0.1-0.2 m/s, heading bias +-6 deg). k_heading 1.2 weaved
      # (yaw rate changing sign) 10.6/min at p95; 0.5 with the settings below
      # 3.3/min, same completion and cross-track (p95 2.05 m).
      # rad/s per rad of bearing:
      k_heading: 0.5
      # No steering inside this bearing: a 0.2 m position error against a
      # carrot 1.5 m ahead already moves the bearing ~8 deg.
      heading_deadzone_deg: 6.0
      # Subtract the turn still in transit (gain x the last delay_s of yaw-rate
      # commands) from the carrot bearing, so the ~1.3 s delay does not make
      # the rover keep correcting a turn it has already been told to make.
      # gain 0 disables it.
      #
      # 1.3 s is the command -> gyro delay measured on bag time, i.e. from a
      # command leaving this stack to its effect showing up in the telemetry
      # this node steers on. On mission_16sept that telemetry was already
      # 1.16 s old on arrival (heading content 1.10 s old at each tick), so the
      # split is either ~0.2 s actuation + ~1.1 s telemetry delay, or ~1.3 s
      # actuation behind a rover clock offset -- the bag cannot tell which
      # (docs/ARQUITECTURA_ACTUAL.md section 8.4 in Earth-rover-ros2-bridge).
      # The compensation is the same end-to-end quantity either way, and
      # test/controller_sim.py passes under both splits; without it the yaw
      # rate changed sign 7.4/min at p95 instead of 2.5/min.
      delay_compensation_s: 1.3
      delay_compensation_gain: 1.0

      # Siegwart gains, used only with steering_source "model" (k_alpha) and
      # linear_law "rho" (k_rho). Stability conditions (the node warns if
      # violated): k_rho > 0, k_beta <= 0, k_alpha - k_rho > 0. k_beta 0 =
      # bearing tracking only; -0.6 opened the replayed turn radius on
      # mission_10sept from 2.7 m to 3.2 m.
      k_rho: 0.5
      k_alpha: 1.5
      k_beta: 0.0
      # The camera faces forward and the model was trained driving forward.
      backward_allowed: false

    pid:
      # kp 0.4 puts the angular command at the 0.3 rad/s limit for a bearing
      # error of ~43 deg, against 5.73 deg under the old arctan/DT law. Picked
      # for robustness to the loop delay: simulated against a delay +
      # first-order plant at actuation ratios 0.98 and 0.50, worst-case
      # overshoot over 30/90/180 deg steps (parenthesis = zero crossings):
      #
      #   kp    ki    kd  | delay 0.6s | 0.9s        | 1.2s
      #   0.5   0.15  0.08|  9.3 (24x) | 13.0 (35x)  | 18.1 (32x)
      #   0.6   0.03  0.10|  1.6 ( 1x) |  5.4 ( 3x)  | 10.9 ( 5x)
      #   0.6   0.00  0.10|  0.0 ( 0x) |  4.6 (24x)  | 10.1 (39x)
      #   0.4   0.03  0.10|  2.4 ( 4x) |  2.5 ( 4x)  |  4.7 ( 4x)  <- chosen
      #
      # ki is small on purpose: the rover does not always execute what it is
      # told, and a large integral winds up against a deficit it cannot fix.
      kp: 0.4
      ki: 0.03
      kd: 0.10
      integral_limit: 0.67     # cap on the integral state (rad*s)
      derivative_alpha: 0.4
      # Speed is only reduced once the goal is far enough off-axis that driving
      # forward stops closing the distance: on mission9sept slowing mid-turn
      # measured a worse yaw-rate ratio (0.29) than cruising (0.50-0.98).
      turn_slowdown_start_deg: 60.0
      turn_slowdown_end_deg: 120.0
      turn_speed_floor: 0.4
